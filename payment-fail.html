<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed — STEELO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=13">
  <style>
    .result-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    .result-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background: var(--sand-300);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }
    .result-icon svg { color: var(--ink); }
  </style>
</head>
<body>
  <nav id="navbar">
    <a href="/" class="nav-link" style="display:flex;align-items:center;">
      <img src="images/logo.png" alt="STEELO" style="height:2.2rem;width:auto;display:block;">
    </a>
  </nav>

  <div id="page-wrap">
    <div class="result-wrap">
      <div class="result-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      <h1 style="font-family:'Cormorant',Georgia,serif;font-weight:300;font-size:clamp(2rem,5vw,3.5rem);color:var(--ink);margin:0 0 1rem;line-height:1.1;">
        Payment was not completed
      </h1>
      <p style="font-family:Montserrat;font-weight:300;font-size:0.875rem;line-height:1.9;color:var(--ink-400);max-width:480px;margin:0 0 3rem;">
        Your card was not charged. You can return to the store and try again, or contact us if you need assistance.
      </p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
        <a href="/" class="btn-primary" style="text-decoration:none;">Back to Store</a>
        <a href="/#contact" class="btn-outline" style="text-decoration:none;">Contact Us</a>
      </div>
    </div>
  </div>
  <script>
    // Break out of iframe if loaded inside one
    if (window !== window.top) { window.top.location.href = window.location.href; }
  </script>
</body>
</html>
